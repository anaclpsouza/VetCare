<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
    <title>VetCare</title>
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="logo-container">
                <img src="./assets/img/logo.svg" alt="Logo VetCare" class="logo">
                <h1 id="texto-logo">VetCare</h1>
            </div>

            <input type="checkbox" id="menu-toggle" class="menu-checkbox">

            <label for="menu-toggle" class="overlay"></label>

            <label for="menu-toggle" class="menu-icon">
                <span class="hamburguer-linha"></span>
            </label>

            <ul class="menu">
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Serviços</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <img src="assets/img/logo.svg" alt="Logo Vet Care" class="logo-hero">
            <div class="hero-content">
                <h1>Onde o seu melhor amigo é tratado como família.</h1>
                <p class="subtitulo">
                    Na VetCare, unimos medicina veterinária de ponta com o carinho e a paciência que o seu pet merece. O
                    cuidado que você busca, com o amor que eles precisam.
                </p>
                <a href="#" class="button-accents button-hero">AGENDE UMA CONSULTA</a>
            </div>
        </section>
    </main>
    <footer></footer>
</body>

</html>
